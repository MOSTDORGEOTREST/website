user  nginx;
worker_processes  auto;
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Скрываем версию nginx в заголовках и на страницах ошибок
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Оптимизация отдачи статики (минимум нагрузки на старый CPU и диск)
    sendfile            on;
    sendfile_max_chunk  512k;
    tcp_nopush          on;
    tcp_nodelay         on;

    # Кэш файловых дескрипторов в ОЗУ (убирает тысячи обращений к диску на 2000+ файлах статики и 3D-тура)
    open_file_cache          max=4096 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # Таймауты и защита от зависших/медленных соединений (Slowloris)
    keepalive_timeout           30s;
    keepalive_requests          1000;
    client_header_timeout       12s;
    client_body_timeout         12s;
    send_timeout                30s;
    reset_timedout_connection   on;

    # Буферы и лимит размера запроса (сайт статический, загрузка файлов не нужна)
    client_max_body_size        1m;
    client_body_buffer_size     16k;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 8k;
    types_hash_max_size         2048;

    # Сжатие: предсжатые на этапе сборки .gz отдаются напрямую без нагрузки на CPU (gzip_static on);
    # динамический gzip с лёгким уровнем 4 работает только как фолбэк (например, для HLS-плейлистов)
    gzip              on;
    gzip_static       on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   4;
    gzip_min_length   256;
    gzip_buffers      16 8k;
    # font/woff2 исключён: WOFF2 уже сжат алгоритмом Brotli, повторный gzip впустую тратит CPU
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/vnd.apple.mpegurl
        image/svg+xml;

    # Общий кэш TLS-сессий в памяти (резко снижает нагрузку на CPU при повторных соединениях)
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Защита от флуда и сканеров (с запасом под HTTP/2-пачки, 3D-плитки и работу через туннель)
    limit_conn_zone   $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_zone    $binary_remote_addr zone=req_general:10m rate=150r/s;
    limit_req_status  429;
    limit_conn_status 429;

    # Политика браузерного кэширования по URI.
    # Задаётся через map на уровне server, чтобы в location-блоках не терялись заголовки безопасности.
    map $uri $cache_control {
        default                                               "no-cache";
        /price.json                                           "public, max-age=86400, stale-while-revalidate=604800";
        ~*^/_astro/                                           "public, max-age=31536000, immutable";
        ~*^/fonts/                                            "public, max-age=31536000, immutable";
        ~*^/3d/.*\.(?:jpg|jpeg|png|webp|svg|js|css|woff2?)$   "public, max-age=2592000, immutable";
        ~*^/3d/                                               "public, max-age=3600";
        ~*^/(?:img|assets)/                                   "public, max-age=604800, stale-while-revalidate=86400";
        ~*^/hls/                                              "";
        ~*^/\.well-known/                                     "no-store";
        ~*\.(?:ico|svg|png|webp|jpg|jpeg)$                    "public, max-age=604800";
    }

    # Заголовки безопасности уровня документа отправляем только для HTML/SVG
    # (не раздуваем заголовки картинок/плиток и не мешаем встроенному просмотрщику PDF в старых браузерах)
    map $sent_http_content_type $csp_header {
        default "";
        ~*^text/html "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.yandex.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com; font-src 'self' data:; media-src 'self' blob: https://mdgt.ru https://www.mdgt.ru; connect-src 'self' https://mdgt.ru https://www.mdgt.ru https://mc.yandex.ru https://mc.yandex.com; worker-src 'self' blob:; frame-src 'self' https://docs.google.com https://*.google.com https://*.googleusercontent.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self';";
        ~*^image/svg\+xml "default-src 'none'; style-src 'unsafe-inline'; sandbox;";
    }

    map $sent_http_content_type $permissions_policy {
        default "";
        ~*^text/html "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self), gyroscope=(self), accelerometer=(self), xr-spatial-tracking=(self)";
    }

    map $sent_http_content_type $coop_header {
        default "";
        ~*^text/html "same-origin-allow-popups";
    }

    include /etc/nginx/conf.d/*.conf;
}
