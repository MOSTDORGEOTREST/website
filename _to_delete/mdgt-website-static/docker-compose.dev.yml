# DEV: без nginx и без сборки образа — папка site/ монтируется в лёгкий
# python-сервер, правки файлов видны сразу после обновления страницы.
#   docker compose -f docker-compose.dev.yml up
#   сайт: http://localhost:8080
services:
  web-dev:
    image: python:3.12-alpine
    container_name: mdgt-website-dev
    working_dir: /site
    volumes:
      - ./site:/site:ro
    command: python -m http.server 8080 --bind 0.0.0.0
    ports:
      - "8080:8080"
    restart: unless-stopped
