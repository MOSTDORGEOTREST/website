server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # сжатие
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml font/woff2;

    # html — всегда свежий (страницы самодостаточные и тяжёлые, но обновляются целиком)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # статика (прайс и будущие ассеты) — кэш на неделю
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # безопасность по мелочи
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
