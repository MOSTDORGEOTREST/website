# PROD: сборка образа с nginx
#   docker compose up -d --build
#   сайт: http://localhost  (порт меняется переменной PORT, напр. PORT=8080 docker compose up -d --build)
services:
  web:
    build: .
    image: mdgt-website:latest
    container_name: mdgt-website
    ports:
      - "${PORT:-80}:80"
    restart: unless-stopped
