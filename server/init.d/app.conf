server {
    listen 80 default_server;
    server_name mdgt.ru www.mdgt.ru _;

    # Быстрый внутренний healthcheck без обращения к диску и логам
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Проверка домена Let's Encrypt (ACME HTTP-01)
    location ^~ /.well-known/acme-challenge/ {
        access_log off;
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name mdgt.ru www.mdgt.ru _;

    ssl_certificate     /etc/nginx/cert/crt.crt;
    ssl_certificate_key /etc/nginx/cert/key.key;

    # Современный быстрый TLS: AEAD-шифры (AES-GCM для новых CPU и ChaCha20 для старых ПК без AES-NI)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve            X25519:prime256v1:secp384r1;
    # Уменьшенный TLS-буфер ускоряет получение первых байт HTML/CSS (TTFB)
    ssl_buffer_size           4k;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    etag on;

    # Защита от перегрузки соединениями и агрессивного сканирования
    limit_conn conn_per_ip 256;
    limit_req  zone=req_general burst=500 nodelay;

    # Разрешаем только безопасные методы чтения (статический сайт + HLS)
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # Заголовки безопасности (действуют для всех location за счёт отсутствия add_header внутри них)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        $permissions_policy always;
    add_header Cross-Origin-Opener-Policy $coop_header always;
    add_header Content-Security-Policy   $csp_header always;
    # Cache-Control без always, чтобы коды ошибок (404/50x) никогда не кэшировались браузером
    add_header Cache-Control             $cache_control;

    # Быстрый внутренний healthcheck для Docker
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Запрет доступа к скрытым файлам и папкам (.git, .env, .claude и т.д.), кроме .well-known
    location ~ /\.(?!well-known) {
        access_log off;
        log_not_found off;
        deny all;
    }

    # Запрет доступа к случайно попавшим резервным и служебным файлам
    location ~* \.(?:bak|conf|dist|fla|in[ci]|log|orig|psd|sh|sql|sw[op]|yml|yaml)$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Хешированные бандлы Astro — быстрый префиксный поиск без регулярных выражений и без записи в access.log
    location ^~ /_astro/ {
        access_log off;
        try_files $uri =404;
    }

    # Локальные шрифты WOFF2
    location ^~ /fonts/ {
        access_log off;
        try_files $uri =404;
    }

    # 3D-тур (1800+ тайлов панорамы — отключаем access_log, чтобы не нагружать диск)
    location ^~ /3d/ {
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Изображения (объекты, приборы, логотипы)
    location ^~ /img/ {
        access_log off;
        try_files $uri =404;
    }

    # Документы, PDF, прайс-листы и превью
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # Проксирование живых HLS-потоков камер лаборатории
    location ^~ /hls/ {
        access_log off;

        limit_except GET HEAD OPTIONS {
            deny all;
        }

        proxy_pass http://172.17.0.1:6767;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_redirect          off;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;

        # Адекватные таймауты вместо 24 часов, чтобы зависший поток не держал воркеры сутки
        proxy_connect_timeout   5s;
        proxy_send_timeout      30s;
        proxy_read_timeout      30s;
    }

    # ACME challenge также на 443 (на случай редиректа при проверке)
    location ^~ /.well-known/acme-challenge/ {
        access_log off;
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Страницы сайта
    location / {
        try_files $uri $uri/ =404;
    }
}
