services:
  sitelab:
    container_name: sitelab
    build:
      context: .
      dockerfile: Dockerfile.web
    image: mdgt-website:latest
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./cert:/etc/nginx/cert
      - ./letsencrypt-challenges:/var/www/letsencrypt:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s
    # Приоритет сайта: при нехватке CPU он получает в 8 раз больше времени, чем acme,
    # а при нехватке ОЗУ ядро убивает его последним
    cpu_shares: 2048
    oom_score_adj: -500
    # Под worker_rlimit_nofile 65535 в nginx.conf (HTTP/2 + кэш дескрипторов + 3D-тур)
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # daemon.sh и start.sh подставляют сюда число ядер сервера (nginx worker_processes auto
          # = все ядра, и квота не душит воркеры). 1.00 — безопасный дефолт для ручного запуска
          cpus: '${WEB_CPUS:-1.00}'
          # Статическому nginx с кэшем дескрипторов и SSL нужно ~30–50 МБ; 256M даёт запас без перерасхода ОЗУ
          memory: ${WEB_MEM_LIMIT:-256M}
        reservations:
          memory: 64M

  acme:
    container_name: sitelab-acme
    build:
      context: .
      dockerfile: Dockerfile.acme
    image: mdgt-acme:latest
    depends_on:
      sitelab:
        condition: service_healthy
    environment:
      ACME_DOMAINS: ${ACME_DOMAINS:-mdgt.ru,www.mdgt.ru}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-sheepdolly2023@gmail.com}
      CHECK_URL: ${CHECK_URL:-http://mdgt.ru/}
      NGINX_CONTAINER: sitelab
      RENEW_BEFORE_DAYS: "${RENEW_BEFORE_DAYS:-30}"
      RENEW_INTERVAL_SECONDS: "${RENEW_INTERVAL_SECONDS:-43200}"
      ACME_STAGING: "${ACME_STAGING:-false}"
    volumes:
      - ./cert:/cert-out
      - ./letsencrypt:/etc/letsencrypt
      - ./letsencrypt-challenges:/var/www/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 5s
    # Продление сертификата не спешит: уступает CPU сайту и первым уходит при нехватке ОЗУ
    cpu_shares: 256
    oom_score_adj: 500
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: '${ACME_CPUS:-0.50}'
          memory: ${ACME_MEM_LIMIT:-256M}
