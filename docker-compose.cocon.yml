# Строгий аварийный режим. Использовать только вместе с docker-compose.yml:
# docker compose -f docker-compose.yml -f docker-compose.cocon.yml up -d --no-deps sitelab
services:
  sitelab:
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          pids: 128
    volumes:
      - ./cert:/etc/nginx/cert:ro
      - ./letsencrypt-challenges:/var/www/letsencrypt:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=1770
      - /run:rw,noexec,nosuid,nodev,size=4m,uid=101,gid=101,mode=0750
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101,mode=0750
      - /var/log/nginx:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0750

  # Профиль не запускается автоматически. В cocon-режиме у контейнеров не должно
  # быть доступа к docker.sock; поэтому автоматическое продление временно отключено.
  acme:
    profiles:
      - cocon-acme-disabled
