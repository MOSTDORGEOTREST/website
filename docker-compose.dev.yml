# DEV: без nginx — Astro dev-сервер с горячей перезагрузкой (HMR).
# Правки src/ и public/ применяются мгновенно, без пересборки.
#   docker compose -f docker-compose.dev.yml up
#   сайт: http://localhost:4321
services:
  web-dev:
    image: node:22-alpine
    container_name: mdgt-website-dev
    working_dir: /app
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=768"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "[ -x node_modules/.bin/astro ] || npm ci --no-audit --no-fund; exec npm run dev -- --host 0.0.0.0 --port 4321"
    ports:
      - "4321:4321"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  node_modules:
