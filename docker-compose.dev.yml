# DEV: без nginx — Astro dev-сервер с горячей перезагрузкой (HMR).
# Правки src/ и public/ применяются мгновенно, без пересборки.
#   docker compose -f docker-compose.dev.yml up
#   сайт: http://localhost:4321
services:
  web-dev:
    image: node:22-alpine
    container_name: mdgt-website-dev
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 4321"
    ports:
      - "4321:4321"
    restart: unless-stopped

volumes:
  node_modules:
